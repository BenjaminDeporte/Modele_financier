[project]
name = "modele-financier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "benjamin.deporte", email = "benjamin.deporte@irt-saintexupery.com" }
]
requires-python = ">=3.11"
dependencies = [
    "highspy>=1.15.1",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
